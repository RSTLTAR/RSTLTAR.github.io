  <style>
  *{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:
linear-gradient(180deg,#050505,#0f0f0f,#050505);
color:#fff;
padding:20px;
min-height:100vh;
}

.container{
width:100%;
max-width:1100px;
margin:auto;
}

.title{
text-align:center;
font-size:42px;
font-weight:800;
margin-bottom:35px;
background:linear-gradient(90deg,#fff,#cfcfcf);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.servers{
display:flex;
justify-content:center;
align-items:center;
gap:15px;
margin-bottom:25px;
flex-wrap:wrap;
}

.server-btn{
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
color:#fff;
border:1px solid rgba(255,255,255,0.15);
padding:14px 28px;
border-radius:15px;
cursor:pointer;
font-size:18px;
font-weight:700;
transition:.3s;
}

.server-btn:hover{
transform:translateY(-3px);
background:#fff;
color:#000;
}

.server-btn.active{
background:#fff;
color:#000;
box-shadow:0 0 20px rgba(255,255,255,.3);
}

.player-wrapper{
position:relative;
width:100%;
padding-top:56.25%;
overflow:hidden;
border-radius:24px;
background:#111;
border:1px solid rgba(255,255,255,.08);
box-shadow:
0 0 40px rgba(255,255,255,.05),
0 10px 30px rgba(0,0,0,.5);
margin-bottom:50px;
}

.player{
display:none;
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
}

.player.active{
display:flex;
}

.player iframe,
.player video{
width:100%;
height:100%;
}

.download-title{
text-align:center;
font-size:32px;
font-weight:800;
margin-bottom:25px;
}

.downloads{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:50px;
}

.download-btn{
position:relative;
display:flex;
justify-content:center;
align-items:center;
text-decoration:none;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(15px);
color:#fff;
padding:20px;
border-radius:18px;
border:1px solid rgba(255,255,255,.15);
font-size:20px;
font-weight:700;
transition:.3s;
overflow:hidden;
}

.download-btn:hover{
background:#fff;
color:#000;
transform:translateY(-5px);
box-shadow:0 10px 25px rgba(255,255,255,.15);
}

.best-badge{
position:absolute;
top:10px;
left:10px;
background:#ffd500;
color:#000;
padding:5px 12px;
border-radius:10px;
font-size:12px;
font-weight:800;
}

.episode-nav{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-bottom:40px;
}

.nav-btn{
text-decoration:none;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(15px);
color:#fff;
padding:16px 28px;
border-radius:18px;
border:1px solid rgba(255,255,255,.15);
font-size:20px;
font-weight:700;
transition:.3s;
display:flex;
align-items:center;
justify-content:center;
min-width:220px;
}

.nav-btn:hover{
background:#fff;
color:#000;
transform:translateY(-4px);
}

.telegram-box{
display:flex;
justify-content:center;
margin-bottom:30px;
}

.telegram-btn{
display:flex;
align-items:center;
justify-content:center;
gap:12px;
text-decoration:none;
background:linear-gradient(135deg,#0088cc,#00bfff);
color:#fff;
padding:18px 35px;
border-radius:20px;
font-size:22px;
font-weight:800;
transition:.3s;
box-shadow:0 0 25px rgba(0,191,255,.35);
}

.telegram-btn:hover{
transform:translateY(-5px) scale(1.03);
box-shadow:0 0 35px rgba(0,191,255,.6);
}

.telegram-icon{
font-size:28px;
}
.player.active{
display:flex;
animation:fadeIn .3s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:scale(.98);
}
to{
opacity:1;
transform:scale(1);
}
}

.plyr{
width:100%;
height:100%;
border-radius:24px;
overflow:hidden;
}
@media(max-width:768px){

.title{
font-size:30px;
}

.server-btn{
width:100%;
}

.nav-btn{
width:100%;
}

.telegram-btn{
width:100%;
font-size:18px;
}

}

  </style>
<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
</head>
<body>

<div class="telegram-box">

</div>
<script>

function showPlayer(playerNumber,button){

document.querySelectorAll('.player').forEach(player=>{
player.classList.remove('active');
});

document.querySelectorAll('.server-btn').forEach(btn=>{
btn.classList.remove('active');
});

document.getElementById('player'+playerNumber).classList.add('active');

button.classList.add('active');

}

</script>

<script>

[
{opacity:0,transform:'translateY(20px)'},

],

duration:700,

}

</html>
